<!doctype html>
<html lang="te"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Temple Admin</title><link rel="stylesheet" href="admin.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../config.js"></script></head>
<body>
<div id="login" class="login"><div class="loginBox"><h1>🌺 Temple Admin</h1><p>అధికారిక నిర్వాహకుల కోసం</p><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Password"><button onclick="login()">Login</button><div id="loginMsg"></div></div></div>
<div id="app" class="hidden"><header><b>🌺 Temple Admin</b><button onclick="logout()">Logout</button></header><main>
<div class="tabs"><button onclick="showTab('events')">📅 Events</button><button onclick="showTab('news')">📢 Announcements</button><button onclick="showTab('gallery')">📸 Gallery</button><button onclick="showTab('settings')">⚙️ Temple Info</button></div>
<section id="events" class="tab"><h2>Events</h2><div class="form"><input id="etitle" placeholder="Event title (Telugu)"><textarea id="edesc" placeholder="Description"></textarea><input id="edate" type="date"><input id="estart" type="time"><input id="eend" type="time"><input id="elocation" placeholder="Location"><button onclick="addEvent()">+ Add Event</button></div><div id="eventAdmin"></div></section>
<section id="news" class="tab hidden"><h2>Announcements</h2><div class="form"><input id="ntitle" placeholder="Title (Telugu)"><textarea id="nbody" placeholder="Announcement"></textarea><button onclick="addNews()">+ Publish Announcement</button></div><div id="newsAdmin"></div></section>
<section id="gallery" class="tab hidden"><h2>Gallery</h2><div class="form"><input id="photoTitle" placeholder="Photo title"><input id="photoFile" type="file" accept="image/*"><button onclick="uploadPhoto()">Upload Photo</button><div id="uploadMsg"></div></div><div id="galleryAdmin" class="adminGallery"></div></section>
<section id="settings" class="tab hidden"><h2>Temple Information</h2><div class="form"><input id="sname" placeholder="Temple name"><input id="saddress" placeholder="Address"><input id="sp1" placeholder="Phone 1"><input id="sp2" placeholder="Phone 2"><input id="swa" placeholder="WhatsApp URL"><input id="sig" placeholder="Instagram URL"><input id="smap" placeholder="Google Maps URL"><input id="stag" placeholder="Hero tagline"><button onclick="saveSettings()">Save Temple Information</button><div id="setMsg"></div></div></section>
</main></div><script src="admin.js"></script></body></html>
