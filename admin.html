<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Temple Admin</title><meta name="robots" content="noindex">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Telugu:wght@400;600&family=Poppins:wght@400;600&display=swap">
<style>
*{box-sizing:border-box}body{margin:0;font-family:Poppins,"Noto Sans Telugu",sans-serif;background:#fdf6e6;color:#2c1712}
header{background:#4a0a14;color:#e0b45a;padding:12px 5%;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #e0b45a}
header a,header button{color:#fff;margin-left:12px;background:none;border:0;cursor:pointer;font:inherit}
main{max-width:860px;margin:0 auto;padding:20px 5% 60px}
.login{max-width:340px;margin:12vh auto;padding:24px;background:#fffdf8;border:1px solid #eadfc4;border-radius:10px;display:grid;gap:10px}
nav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
nav button{padding:8px 14px;border:1px solid #4a0a14;background:#fff;border-radius:6px;cursor:pointer;font:inherit}
nav button.on{background:#4a0a14;color:#fff}
form,.row{background:#fffdf8;border:1px solid #eadfc4;border-radius:10px;padding:16px;margin-bottom:14px}
label{display:block;font-size:.8rem;font-weight:600;margin:10px 0 3px;color:#650e19}
input:not([type=checkbox]),textarea{width:100%;padding:9px;border:1px solid #d9c9a0;border-radius:6px;font:inherit}
textarea{min-height:90px}
.btn{background:#4a0a14;color:#fff;border:0;border-radius:6px;padding:9px 18px;cursor:pointer;font:inherit;margin-top:14px}
.btn.alt{background:#fff;color:#4a0a14;border:1px solid #4a0a14;padding:5px 12px;margin:0 0 0 6px}
.row{display:flex;gap:12px;align-items:center;justify-content:space-between}
.row img,.pv{width:64px;height:48px;object-fit:cover;border-radius:5px}
.pv{display:block;width:100%;height:auto;max-height:160px;margin-bottom:6px}
.pv[hidden]{display:none}
#msg{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);padding:10px 18px;border-radius:8px;background:#fff;border:1px solid #ccc}
#msg.ok{border-color:#2e7d32;color:#2e7d32}#msg.bad{border-color:#b00020;color:#b00020}
[hidden]{display:none!important}
</style></head><body>
<form id="login" class="login" hidden><h2 style="margin:0">Admin login</h2>
<input id="em" type="email" placeholder="Email" required autocomplete="username"><input id="pw" type="password" placeholder="Password" required autocomplete="current-password">
<button class="btn" style="margin:0">Log in</button></form>
<div id="app" hidden>
<header><b>Temple admin</b><span><a href="index.html" target="_blank">View site</a><button id="out">Log out</button></span></header>
<main><nav id="tabs"></nav><div id="panel"></div></main></div>
<p id="msg" hidden></p>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script><script src="admin.js"></script>
</body></html>
